name: Baseline Windows (self-hosted manual)

# Thin wrapper: same reusable build as baseline-windows.yml.
# Requires a registered runner with labels:
#   self-hosted, linux, x64, librewolf-builder
# See docs/SELF-HOSTED.md. Do not run until such a runner is available.

on:
  workflow_dispatch:
    inputs:
      confirm_runner_ready:
        description: "Type READY if a compatible self-hosted runner is online"
        required: true
        type: string
        default: ""

concurrency:
  group: baseline-windows-self-hosted
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Require READY confirmation
        env:
          CONFIRM: ${{ inputs.confirm_runner_ready }}
        run: |
          if [[ "$CONFIRM" != "READY" ]]; then
            echo "Refusing to start: confirm_runner_ready must be READY" >&2
            echo "Register a runner with labels: self-hosted linux x64 librewolf-builder" >&2
            echo "See docs/SELF-HOSTED.md" >&2
            exit 1
          fi

  local-validate:
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install jq and git-lfs
        run: sudo apt-get update && sudo apt-get install -y jq git-lfs
      - name: Local validation
        run: bash scripts/local-validate.sh
      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baseline-local-validate-self-hosted
          path: |
            artifacts/
            work/*.source.tar.gz.sha256
          if-no-files-found: warn
          retention-days: 7

  build-windows-baseline:
    needs: [guard, local-validate]
    uses: ./.github/workflows/baseline-windows-reusable.yml
    with:
      runner_profile: self-hosted
      runs_on_json: '["self-hosted","linux","x64","librewolf-builder"]'
      moz_make_flags: "-j2"
      try_swap: "1"
