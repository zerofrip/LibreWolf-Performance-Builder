name: Baseline Windows x64 LibreWolf

# Phase 2: upstream-equivalent Windows x64 package (bsys6 tag 155.0-1).
# Overlay does not enable LTO / x86-64-v3 / CSIR. Failures must not fall back.
# Note: upstream bsys6 may inject --enable-profile-use when assets/windows.profdata exists.

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/baseline-windows.yml"
      - "scripts/**"
      - "configs/mozconfig.baseline.frag"
      - "upstream/**"
  pull_request:
    paths:
      - ".github/workflows/baseline-windows.yml"
      - "scripts/**"
      - "configs/mozconfig.baseline.frag"
      - "upstream/**"

concurrency:
  group: baseline-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install jq and git-lfs
        run: sudo apt-get update && sudo apt-get install -y jq git-lfs

      - name: Local validation (pins, scripts, source fetch)
        run: bash scripts/local-validate.sh

      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baseline-local-validate
          path: |
            artifacts/
            work/*.source.tar.gz.sha256
          if-no-files-found: warn
          retention-days: 7

  build-windows-baseline:
    needs: local-validate
    runs-on: ubuntu-latest
    timeout-minutes: 720
    container:
      # Prefer Codeberg-published image (worked for toolchain bootstrap in run 33754159563).
      image: codeberg.org/librewolf/bsys6:windows
      options: --user root
    env:
      TARGET: windows
      ARCH: x86_64
      LTO: ""
      MOZ_PGO: ""
    steps:
      - name: Checkout overlay
        uses: actions/checkout@v4

      - name: Disk before
        run: bash scripts/disk-report.sh gha-before

      - name: Install git/curl/jq/git-lfs if missing
        run: |
          apt-get update
          apt-get install -y jq git curl ca-certificates git-lfs
          git lfs install

      - name: Cache pinned source tarball
        uses: actions/cache@v4
        with:
          path: work/librewolf-155.0-1.source.tar.gz
          key: lw-source-${{ hashFiles('upstream/metadata.json') }}

      - name: Verify baseline config (no overlay LTO/PGO env)
        run: bash scripts/verify-baseline-config.sh

      - name: Build upstream-equivalent Windows package
        run: bash scripts/build-windows-baseline.sh

      - name: Disk after
        if: always()
        run: bash scripts/disk-report.sh gha-after

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baseline-windows-x64
          path: |
            out/
            artifacts/
          if-no-files-found: warn
          retention-days: 14

      - name: Fail if build metadata status is not ok
        run: |
          test -f artifacts/baseline-windows-metadata.json
          jq -e '.status == "ok"' artifacts/baseline-windows-metadata.json
          jq -e '.moz_target == "x86_64-pc-windows-msvc"' artifacts/baseline-windows-metadata.json
          jq -e '.optimizations.lto == false and .optimizations.x86_64_v3 == false and .optimizations.csir == false' \
            artifacts/baseline-windows-metadata.json
          if [[ -f artifacts/generated-target.txt ]]; then
            grep -F 'x86_64-pc-windows-msvc' artifacts/generated-target.txt
            if grep -E 'mingw32|mingw64' artifacts/generated-target.txt; then
              echo "ERROR: generated mozconfig still contains mingw triple" >&2
              exit 1
            fi
          fi
