name: Baseline Windows x64 LibreWolf

# Phase 2: upstream-equivalent Windows x64 package (bsys6 tag 155.0-1).
# Push/PR always use standard GitHub-hosted runners.
# Manual dispatch may select self-hosted or optional larger-custom labels.
# Overlay does not enable LTO / x86-64-v3 / CSIR. Upstream PGO + rust.mk gkrust LTO remain.

on:
  workflow_dispatch:
    inputs:
      runner_profile:
        description: "Runner profile (standard = GitHub-hosted ubuntu-latest)"
        required: true
        type: choice
        default: standard
        options:
          - standard
          - self-hosted
          - larger-custom
      larger_runner_label:
        description: "Only for larger-custom — org-defined larger runner label (e.g. ubuntu-latest-m)"
        required: false
        type: string
        default: ""
  push:
    paths:
      - ".github/workflows/baseline-windows.yml"
      - ".github/workflows/baseline-windows-reusable.yml"
      - "scripts/**"
      - "configs/mozconfig.baseline.frag"
      - "upstream/**"
  pull_request:
    paths:
      - ".github/workflows/baseline-windows.yml"
      - ".github/workflows/baseline-windows-reusable.yml"
      - "scripts/**"
      - "configs/mozconfig.baseline.frag"
      - "upstream/**"

concurrency:
  group: baseline-windows-${{ github.ref }}-${{ github.event_name }}-${{ inputs.runner_profile || 'standard' }}
  cancel-in-progress: true

jobs:
  local-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install jq and git-lfs
        run: sudo apt-get update && sudo apt-get install -y jq git-lfs

      - name: Local validation (pins, scripts, source fetch)
        run: bash scripts/local-validate.sh

      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baseline-local-validate
          path: |
            artifacts/
            work/*.source.tar.gz.sha256
          if-no-files-found: warn
          retention-days: 7

  # Resolve runs-on JSON for the reusable build job.
  select-runner:
    needs: local-validate
    runs-on: ubuntu-latest
    outputs:
      profile: ${{ steps.sel.outputs.profile }}
      runs_on_json: ${{ steps.sel.outputs.runs_on_json }}
    steps:
      - id: sel
        env:
          EVENT_NAME: ${{ github.event_name }}
          PROFILE_IN: ${{ inputs.runner_profile || 'standard' }}
          LARGER_LABEL: ${{ inputs.larger_runner_label || '' }}
        run: |
          set -euo pipefail
          # Push/PR always stay on standard GitHub-hosted.
          if [[ "$EVENT_NAME" != "workflow_dispatch" ]]; then
            PROFILE=standard
          else
            PROFILE="$PROFILE_IN"
          fi
          case "$PROFILE" in
            standard)
              JSON='"ubuntu-latest"'
              ;;
            self-hosted)
              JSON='["self-hosted","linux","x64","librewolf-builder"]'
              ;;
            larger-custom)
              if [[ -z "$LARGER_LABEL" ]]; then
                echo "ERROR: larger-custom requires larger_runner_label input" >&2
                exit 1
              fi
              # JSON-encode a single label string
              JSON="$(jq -cn --arg l "$LARGER_LABEL" '$l')"
              ;;
            *)
              echo "ERROR: unknown runner_profile=$PROFILE" >&2
              exit 1
              ;;
          esac
          echo "profile=$PROFILE" >>"$GITHUB_OUTPUT"
          {
            echo "runs_on_json<<EOF"
            echo "$JSON"
            echo "EOF"
          } >>"$GITHUB_OUTPUT"
          echo "Selected profile=$PROFILE runs_on_json=$JSON"

  build-windows-baseline:
    needs: [local-validate, select-runner]
    uses: ./.github/workflows/baseline-windows-reusable.yml
    with:
      runner_profile: ${{ needs.select-runner.outputs.profile }}
      runs_on_json: ${{ needs.select-runner.outputs.runs_on_json }}
      moz_make_flags: "-j2"
      try_swap: "1"
