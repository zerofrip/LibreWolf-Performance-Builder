name: Baseline Windows x64 LibreWolf

# Phase 2 lightweight checks on push/PR (local-validate only).
# Full upstream-equivalent browser build is MANUAL-ONLY:
#   - known OOM on standard public ubuntu-latest (run 33862245103)
#   - use workflow_dispatch with runner_profile=self-hosted (preferred)
#   - standard full build remains available for diagnostics only (expect OOM)
# Overlay does not enable LTO / x86-64-v3 / CSIR. Upstream PGO + rust.mk gkrust LTO remain.

on:
  workflow_dispatch:
    inputs:
      runner_profile:
        description: "Full-build runner (self-hosted preferred; standard = known-insufficient diagnostics)"
        required: true
        type: choice
        default: self-hosted
        options:
          - self-hosted
          - standard
          - larger-custom
      larger_runner_label:
        description: "Only for larger-custom — org-defined larger runner label"
        required: false
        type: string
        default: ""
      run_full_build:
        description: "Run full upstream-equivalent Windows build (expensive)"
        required: true
        type: boolean
        default: true
      acknowledge_standard_oom:
        description: "Required if runner_profile=standard — type UNDERSTAND-OOM"
        required: false
        type: string
        default: ""
  push:
    paths:
      - ".github/workflows/baseline-windows.yml"
      - ".github/workflows/baseline-windows-reusable.yml"
      - ".github/workflows/baseline-windows-self-hosted.yml"
      - "scripts/**"
      - "configs/mozconfig.baseline.frag"
      - "upstream/**"
  pull_request:
    paths:
      - ".github/workflows/baseline-windows.yml"
      - ".github/workflows/baseline-windows-reusable.yml"
      - ".github/workflows/baseline-windows-self-hosted.yml"
      - "scripts/**"
      - "configs/mozconfig.baseline.frag"
      - "upstream/**"

concurrency:
  group: baseline-windows-${{ github.ref }}-${{ github.event_name }}-${{ inputs.runner_profile || 'validate' }}
  cancel-in-progress: true

jobs:
  local-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install jq and git-lfs
        run: sudo apt-get update && sudo apt-get install -y jq git-lfs

      - name: Local validation (pins, scripts, source fetch)
        run: bash scripts/local-validate.sh

      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baseline-local-validate
          path: |
            artifacts/
            work/*.source.tar.gz.sha256
          if-no-files-found: warn
          retention-days: 7

  # Full build is never started by push/PR — only workflow_dispatch.
  select-runner:
    if: github.event_name == 'workflow_dispatch' && inputs.run_full_build
    needs: local-validate
    runs-on: ubuntu-latest
    outputs:
      profile: ${{ steps.sel.outputs.profile }}
      runs_on_json: ${{ steps.sel.outputs.runs_on_json }}
    steps:
      - id: sel
        env:
          PROFILE_IN: ${{ inputs.runner_profile }}
          LARGER_LABEL: ${{ inputs.larger_runner_label || '' }}
          ACK_OOM: ${{ inputs.acknowledge_standard_oom || '' }}
        run: |
          set -euo pipefail
          PROFILE="$PROFILE_IN"
          case "$PROFILE" in
            standard)
              if [ "$ACK_OOM" != "UNDERSTAND-OOM" ]; then
                echo "ERROR: standard full build is known-insufficient (OOM on run 33862245103)." >&2
                echo "Set acknowledge_standard_oom=UNDERSTAND-OOM for diagnostics only, or use self-hosted." >&2
                exit 1
              fi
              JSON='"ubuntu-latest"'
              ;;
            self-hosted)
              JSON='["self-hosted","linux","x64","librewolf-builder"]'
              ;;
            larger-custom)
              if [ -z "$LARGER_LABEL" ]; then
                echo "ERROR: larger-custom requires larger_runner_label input" >&2
                exit 1
              fi
              JSON="$(jq -cn --arg l "$LARGER_LABEL" '$l')"
              ;;
            *)
              echo "ERROR: unknown runner_profile=$PROFILE" >&2
              exit 1
              ;;
          esac
          echo "profile=$PROFILE" >>"$GITHUB_OUTPUT"
          {
            echo "runs_on_json<<EOF"
            echo "$JSON"
            echo "EOF"
          } >>"$GITHUB_OUTPUT"
          echo "Selected profile=$PROFILE runs_on_json=$JSON"

  build-windows-baseline:
    if: github.event_name == 'workflow_dispatch' && inputs.run_full_build
    needs: [local-validate, select-runner]
    uses: ./.github/workflows/baseline-windows-reusable.yml
    with:
      runner_profile: ${{ needs.select-runner.outputs.profile }}
      runs_on_json: ${{ needs.select-runner.outputs.runs_on_json }}
      moz_make_flags: "-j2"
      try_swap: "1"
